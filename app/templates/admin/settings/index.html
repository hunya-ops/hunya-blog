{% extends "admin/base.html" %}

{% block title %}系统设置 - {{ blog_title }}{% endblock %}

{% block admin_content %}
<div class="admin-page-header">
    <div class="header-left">
        <h2>系统设置</h2>
        <p class="header-subtitle">管理站点的显示和系统参数</p>
    </div>
</div>

<div class="settings-grid">
    <a href="{{ url_for('admin.settings_home') }}" class="settings-card">
        <div class="card-icon">🏠</div>
        <div class="card-info">
            <h3>首页配置</h3>
            <p>使用 Markdown 编辑器自定义博客首页展示内容</p>
        </div>
    </a>

    <a href="{{ url_for('admin.settings_basic') }}" class="settings-card">
        <div class="card-icon">⚙️</div>
        <div class="card-info">
            <h3>基本信息</h3>
            <p>修改博客标题、副标题、分页设置及导航可见性</p>
        </div>
    </a>

    <a href="{{ url_for('admin.settings_password') }}" class="settings-card">
        <div class="card-icon">🔒</div>
        <div class="card-info">
            <h3>管理密码</h3>
            <p>修改进入后台管理系统的访问密码</p>
        </div>
    </a>

    <a href="{{ url_for('admin.settings_system') }}" class="settings-card">
        <div class="card-icon">ℹ️</div>
        <div class="card-info">
            <h3>系统信息</h3>
            <p>查看服务器环境、数据库大小及统计摘要</p>
        </div>
    </a>
</div>

<style>
    .settings-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 24px;
        margin-top: 24px;
    }

    .settings-card {
        display: flex;
        align-items: center;
        padding: 24px;
        background: var(--bg-card, #fff);
        border-radius: 16px;
        border: 1px solid var(--border, rgba(0, 0, 0, 0.1));
        text-decoration: none;
        color: inherit;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .settings-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.05);
        border-color: var(--primary, #0071e3);
    }

    .card-icon {
        font-size: 32px;
        margin-right: 20px;
        width: 60px;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg-body, #f5f5f7);
        border-radius: 12px;
    }

    .card-info h3 {
        margin: 0 0 4px;
        font-size: 1.1rem;
    }

    .card-info p {
        margin: 0;
        font-size: 0.9rem;
        color: var(--text-secondary, #6e6e73);
        line-height: 1.4;
    }

    [data-theme="dark"] .settings-card {
        background: rgba(255, 255, 255, 0.05);
    }

    [data-theme="dark"] .card-icon {
        background: rgba(255, 255, 255, 0.1);
    }
</style>
{% endblock %}
