{% extends "admin/base.html" %}

{% block title %}基本信息 - {{ blog_title }}{% endblock %}

{% block admin_content %}
<div class="page-header">
    <h1>基本信息</h1>
</div>
<div class="settings-page">
    <form method="POST" class="settings-form-full">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <div class="form-group">
            <label>站点标题</label>
            <input type="text" name="blog_title" class="form-input" value="{{ blog_title }}">
        </div>
        <div class="form-group">
            <label>站点描述</label>
            <textarea name="blog_description" class="form-textarea" rows="4">{{ blog_description }}</textarea>
        </div>
        <div class="form-actions-bottom">
            <button type="submit" class="btn btn-primary">保存设置</button>
        </div>
    </form>
</div>
{% endblock %}
