services:
  web:
    build: .
    ports:
      - "${DOCKER_BIND:-0.0.0.0}:${PORT:-5000}:5000"
    volumes:
      - ./data:/app/data
      - ./app/static/uploads:/app/app/static/uploads
      - ./env:/app/.env
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:alpine
    restart: unless-stopped
