version: '3.8'

services:
  web:
    build: .
    env_file: .env
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    ports:
      - "${DOCKER_BIND:-127.0.0.1}:${PORT:-5000}:5000"
    volumes:
      - app_data:/app/data
      - app_uploads:/app/app/static/uploads
    networks:
      - app-network
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    user: appuser

  redis:
    image: redis:alpine
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  app_data:
  app_uploads:
  redis_data:
